<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحدث مع الذكاء الاصطناعي</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e293b, #0f172a);
  }
  .btn-main {
    padding: 18px 40px;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(99,102,241,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-main:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(99,102,241,0.55);
  }

  /* نافذة المحادثة */
  .chat-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .chat-overlay.active { display: flex; }

  .chat-window {
    width: 100%;
    max-width: 420px;
    height: 600px;
    max-height: 90vh;
    background: #111827;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .chat-header {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: bold;
    font-size: 18px;
  }
  .chat-header .close-btn {
    cursor: pointer;
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 16px;
  }
  .chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #0f172a;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
  }
  .msg.bot {
    align-self: flex-start;
    background: #1f2937;
    color: #e5e7eb;
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    align-self: flex-end;
    background: #6366f1;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .chat-input {
    display: flex;
    padding: 12px;
    gap: 8px;
    background: #111827;
    border-top: 1px solid #1f2937;
  }
  .chat-input input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #374151;
    background: #1f2937;
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  .chat-input button {
    padding: 0 18px;
    border: none;
    border-radius: 10px;
    background: #6366f1;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
  .chat-input button:hover { background: #4f46e5; }
</style>
</head>
<body>

<button class="btn-main" onclick="openChat()">💬 التحدث مع AI</button>

<div class="chat-overlay" id="chatOverlay">
  <div class="chat-window">
    <div class="chat-header">
      <span>🤖 محادثة مع Gemma AI</span>
      <button class="close-btn" onclick="closeChat()">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="msg bot">مرحباً 👋 أنا Gemma، كيف أقدر أساعدك اليوم؟</div>
    </div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()">إرسال</button>
    </div>
  </div>
</div>

<script>
function openChat() {
  document.getElementById('chatOverlay').classList.add('active');
}
function closeChat() {
  document.getElementById('chatOverlay').classList.remove('active');
}

function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  const messages = document.getElementById('chatMessages');

  const userMsg = document.createElement('div');
  userMsg.className = 'msg user';
  userMsg.textContent = text;
  messages.appendChild(userMsg);

  input.value = '';
  messages.scrollTop = messages.scrollHeight;

  // رد تجريبي مؤقت (بدون اتصال فعلي بأي API)
  setTimeout(() => {
    const botMsg = document.createElement('div');
    botMsg.className = 'msg bot';
    botMsg.textContent = 'هذا رد تجريبي. لتفعيل ردود Gemma الحقيقية يجب ربط الصفحة بمفتاح API الخاص بجوجل.';
    messages.appendChild(botMsg);
    messages.scrollTop = messages.scrollHeight;
  }, 600);
}
</script>

</body>
</html>
